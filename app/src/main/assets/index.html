<title>NOX - مدیریت زمان</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}:root:has(.light-theme){color-scheme:light}
body{--bg:#0c0e16;--panel:#141824;--panel2:#1c2130;--field:#0f121b;--text:#eceef6;--body:#cdd2e0;--muted:#98a0b6;--border:#242a3b;--line2:#343b52;--moon:#e9dfc4;
--c-core:#9aa8ff;--c-settings:#b3bbd0;--c-notes:#f0c777;--c-gmail:#62a8ee;--c-noxcod:#9aa8ff;--c-vpn:#6fdcc8;--on-sec:#0c0e16;
--danger:#ff9eab;--danger-bg:#ff9eab18;--danger-bd:#ff9eab45;--warn:#ebd08f;--warn-bg:#ebd08f12;--warn-bd:#ebd08f40;--ok:#86e8bb;--ok-bg:#86e8bb1c;--shadow:0 14px 40px #0009;--accent:var(--c-core)}
body.light-theme{--bg:#f3f5fa;--panel:#fff;--panel2:#e9edf5;--field:#f6f8fc;--text:#161a26;--body:#394156;--muted:#5b6479;--border:#dde2ed;--line2:#c8cfdf;--moon:#c79a2e;
--c-core:#4a5ad4;--c-settings:#566077;--c-notes:#a2650b;--c-gmail:#1f64b5;--c-noxcod:#4a5ad4;--c-vpn:#0c7f6e;--on-sec:#fff;
--danger:#b0233b;--danger-bg:#b0233b12;--danger-bd:#b0233b44;--warn:#85560a;--warn-bg:#c9921b18;--warn-bd:#c9921b55;--ok:#0b7650;--ok-bg:#0b765016;--shadow:0 14px 40px #1b244033}
#app{--sec:var(--c-core)}
#app:has(.settings-hero){--sec:var(--c-settings)}#app:has(.notes-hero){--sec:var(--c-notes)}#app:has(.gmail-hero){--sec:var(--c-gmail)}#app:has(.project-hero){--sec:var(--c-noxcod)}#app:has(.vpn-hero){--sec:var(--c-vpn)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:72px}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Vazirmatn',Tahoma,'Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--sec,var(--accent));outline-offset:2px}
.hidden{display:none!important}

/* header: wordmark with crescent */
header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:11px;height:58px;padding-inline:max(20px,calc((100% - 720px)/2 + 16px));background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);font-size:20px;font-weight:800;letter-spacing:.18em}
main{max-width:720px;margin:auto;padding:24px 16px 132px}
h1{font-size:28px;font-weight:800;line-height:1.35;margin:4px 0 18px}
.date-title{color:var(--muted);font-size:13px;margin:-8px 0 18px}

/* section intro (open layout, tinted by section colour) */
.project-hero,.vpn-hero,.gmail-hero,.notes-hero,.settings-hero{padding:2px 2px 22px;margin-bottom:20px;border-bottom:1px solid var(--border)}
.project-hero h1,.vpn-hero h1,.gmail-hero h1,.notes-hero h1,.settings-hero h1{margin:12px 0 8px;font-size:30px}
.project-hero p,.vpn-hero p,.gmail-hero p,.notes-hero p,.settings-hero p{margin:0;max-width:58ch;color:var(--muted);font-size:13.5px;line-height:2}
.project-kicker{display:flex;align-items:center;gap:8px;color:var(--sec);font-size:12px;font-weight:700;letter-spacing:.06em}
.project-kicker::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sec);flex:none}
.project-count{display:inline-flex;align-items:center;gap:7px;margin-top:16px;padding:6px 13px;border-radius:999px;background:color-mix(in srgb,var(--sec) 14%,transparent);color:var(--sec);font-size:12.5px;font-weight:600}
.section-heading{display:flex;justify-content:space-between;align-items:baseline;margin:26px 2px 12px;font-size:14px;font-weight:800}
.section-heading small{color:var(--muted);font-weight:400;font-size:12px}

/* shared controls */
label{display:block;color:var(--muted);font-size:13px;margin-bottom:8px}
input,select,textarea{width:100%;color:var(--text);background:var(--field);border:1px solid var(--line2);border-radius:12px;padding:13px 14px;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--sec,var(--accent));box-shadow:0 0 0 3px color-mix(in srgb,var(--sec,var(--accent)) 22%,transparent)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
.add-project{flex:none;min-height:46px;border:0;border-radius:12px;padding:0 18px;background:var(--sec);color:var(--on-sec);font-weight:700;font-size:14px;cursor:pointer;transition:transform .1s,filter .15s}
.add-project:hover{filter:brightness(1.07)}.add-project:active{transform:scale(.98)}
.project-form{display:flex;gap:8px;padding:6px;background:var(--panel);border:1px solid var(--line2);border-radius:18px;margin:0 0 6px;transition:border-color .15s}
.project-form:focus-within{border-color:var(--sec)}
.project-form input,.project-form input:focus{min-width:0;flex:1;border:0;background:transparent;box-shadow:none;padding:12px}
.gmail-form,.note-form,.vpn-form{display:grid;gap:10px;padding:14px;background:var(--panel);border:1px solid var(--border);border-radius:18px;margin:0 0 6px}
.note-form textarea{min-height:120px;resize:vertical;line-height:1.9}
.note-form select,.settings-card select{appearance:auto}

/* list rows */
.project-list,.note-list,.server-list,.settings-grid{display:grid;gap:10px}
.project-item,.gmail-item{display:flex;align-items:center;gap:13px;padding:13px 14px;background:var(--panel);border:1px solid var(--border);border-radius:16px}
.project-symbol,.gmail-symbol,.server-icon,.ico{width:44px;height:44px;display:grid;place-items:center;flex:none;border-radius:13px;background:color-mix(in srgb,var(--sec,var(--accent)) 15%,transparent);color:var(--sec,var(--accent));font-size:20px}
.project-name{flex:1;min-width:0;overflow-wrap:anywhere;font-size:15px;font-weight:700}
.project-number{display:block;color:var(--muted);font-size:11.5px;font-weight:400;margin-top:2px}
.gmail-info{flex:1;min-width:0;overflow-wrap:anywhere}.gmail-label{font-size:14.5px;font-weight:700}
.gmail-address{direction:ltr;text-align:right;color:var(--sec);font-size:13px;margin-top:4px;overflow-wrap:anywhere}
.gmail-note{color:var(--muted);font-size:12.5px;margin-top:4px;line-height:1.8}
.delete-project{flex:none;width:38px;height:38px;border:1px solid var(--danger-bd);border-radius:11px;background:var(--danger-bg);color:var(--danger);font-size:20px;line-height:1;cursor:pointer;transition:background .15s}
.delete-project:hover{background:color-mix(in srgb,var(--danger) 26%,transparent)}
.project-empty,.gmail-empty,.note-empty{text-align:center;padding:34px 18px;border:1.5px dashed var(--line2);border-radius:18px;color:var(--muted);line-height:2;font-size:13.5px}
.project-empty span{display:block;font-size:30px;margin-bottom:6px;color:var(--sec)}
.simple-row{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--border);padding:14px 16px;border-radius:14px;margin:9px 0}
.simple-row strong{font-variant-numeric:tabular-nums}

/* time tasks (kept from the original) */
.task{display:flex;align-items:center;gap:14px;width:100%;text-align:right;color:inherit;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px;margin:10px 0;cursor:pointer;font:inherit}
.task:active{background:var(--panel2)}.task-info{flex:1}.task-title{font-size:15.5px;font-weight:700}.task-sub{display:block;color:var(--muted);font-size:13px;margin-top:4px}.minutes{white-space:nowrap;color:var(--accent);font-size:14px;font-weight:600}.soon{cursor:default;opacity:.7}

/* notes */
.note-tools{display:flex;gap:8px;margin:14px 0 0}.note-tools input{min-width:0;font-size:14px}
.note-card{padding:16px;border:1px solid var(--border);border-radius:16px;background:var(--panel)}
.note-card.pinned{border-color:color-mix(in srgb,var(--sec) 55%,var(--border));box-shadow:inset -3px 0 0 var(--sec)}
.note-card-top{display:flex;align-items:flex-start;gap:10px}.note-card-title{font-size:15px;font-weight:800;flex:1;overflow-wrap:anywhere}
.note-category{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--sec) 15%,transparent);color:var(--sec);white-space:nowrap}
.note-body{font-size:13.5px;color:var(--body);line-height:2;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:10px}
.note-meta{font-size:11.5px;color:var(--muted);margin-top:12px}
.note-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.note-actions button,.settings-card button,.server-actions button{min-height:40px;border:1px solid var(--line2);border-radius:11px;padding:0 14px;background:var(--panel2);color:var(--text);font-size:12.5px;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s}
.note-actions button:hover,.settings-card button:hover,.server-actions button:hover{border-color:var(--muted)}
.note-actions .danger,.settings-card .danger{color:var(--danger);border-color:var(--danger-bd);background:var(--danger-bg)}

/* settings */
.settings-card{padding:18px;background:var(--panel);border:1px solid var(--border);border-radius:16px}
.settings-card h3{font-size:15px;font-weight:800;margin:0 0 6px}
.settings-card p{font-size:12.5px;line-height:1.9;color:var(--muted);margin:0 0 14px}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.settings-row span{font-size:13.5px}
.settings-row select{width:auto;min-width:150px;padding:10px 12px;font-size:14px}
.settings-actions{display:flex;gap:8px;flex-wrap:wrap}.settings-actions button{font-size:13px}
.settings-status{font-size:12px;color:var(--muted);line-height:1.9;margin-top:12px}
.settings-card input[type=file]{font-size:12px;padding:8px}

/* gmail / vpn notices */
.vpn-note,.gmail-warning{padding:12px 14px;border:1px solid var(--warn-bd);background:var(--warn-bg);color:var(--warn);border-radius:14px;font-size:12.5px;line-height:2;margin:0 0 18px}
.gmail-warning{margin-bottom:16px}

/* vpn servers */
.server-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:15px}
.server-top{display:flex;align-items:center;gap:12px}
.server-meta{flex:1;min-width:0}.server-name{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.server-host{direction:ltr;text-align:right;color:var(--muted);font:11.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin-top:4px;overflow-wrap:anywhere}
.server-status{font-size:11.5px;font-weight:600;border-radius:999px;padding:5px 11px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.server-status.warn{background:var(--warn-bg);color:var(--warn)}.server-status.ok{background:var(--ok-bg);color:var(--ok)}.server-status.bad{background:var(--danger-bg);color:var(--danger)}
.server-actions{display:flex;gap:8px;margin-top:14px}.server-actions button{flex:1;min-width:0;padding:0 8px}
.server-actions button.primary{background:var(--sec);color:var(--on-sec);border-color:transparent;font-weight:700}
.server-actions button:disabled{opacity:.45;cursor:default}
.vpn-all{width:100%;min-height:46px;margin:0 0 16px;border:1px solid color-mix(in srgb,var(--sec) 45%,var(--line2));border-radius:12px;background:color-mix(in srgb,var(--sec) 12%,transparent);color:var(--sec);font-size:14px;font-weight:700;cursor:pointer}.vpn-all:disabled{opacity:.6;cursor:default}
.server-result{font-size:12px;color:var(--muted);margin-top:10px;min-height:18px;line-height:1.8}

/* bottom dock */
nav{position:fixed;z-index:3;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:696px;margin-inline:auto;display:flex;gap:2px;padding:6px;background:color-mix(in srgb,var(--panel) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line2);border-radius:26px;box-shadow:var(--shadow)}
nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 7px;border:0;border-radius:20px;background:transparent;color:var(--muted);font-size:11px;font-weight:500;line-height:1.3;cursor:pointer;transition:color .15s}
nav button i{width:52px;height:30px;display:grid;place-items:center;border-radius:15px;transition:background .2s,color .2s}
nav button:hover i{background:color-mix(in srgb,var(--c) 10%,transparent)}
nav button.active{color:var(--text);font-weight:700}
nav button.active i{background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c)}
nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav [data-tab=settings]{--c:var(--c-settings)}nav [data-tab=notes]{--c:var(--c-notes)}nav [data-tab=gmail]{--c:var(--c-gmail)}nav [data-tab=noxcod]{--c:var(--c-noxcod)}nav [data-tab=vpn]{--c:var(--c-vpn)}

/* dialog + toast (respond to actions) */
.overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:18px;background:#05070cb8;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:nox-fade .18s ease-out}
.dialog{width:min(100%,420px);background:var(--panel);border:1px solid var(--line2);border-radius:24px;padding:24px;box-shadow:var(--shadow);animation:nox-pop .22s cubic-bezier(.2,.9,.3,1.1)}
.dialog h2{font-size:19px;font-weight:800;margin:0 0 18px}.dialog input{font-size:18px}
.actions{display:flex;gap:10px;margin-top:20px}.actions button{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--line2);font-size:14px;cursor:pointer}
.cancel{background:transparent;color:var(--text)}.save{background:var(--accent);color:var(--on-sec);border-color:transparent!important;font-weight:700}
.toast{position:fixed;z-index:10;bottom:calc(98px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);border-radius:999px;padding:10px 20px;font-size:13px;font-weight:600;box-shadow:var(--shadow);max-width:90%;white-space:nowrap;animation:nox-rise .22s ease-out}

/* connect dialog */
.connect-dialog{--sec:var(--c-vpn);max-height:calc(100vh - 36px);overflow:auto}
.connect-dialog h2{margin-bottom:4px;overflow-wrap:anywhere}
.cn-host{direction:ltr;text-align:right;color:var(--muted);font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-wrap:anywhere}
.cn-sec{margin-top:20px}.cn-sec h3{font-size:13.5px;font-weight:800;margin:0 0 4px}.cn-sec p{font-size:12px;line-height:1.9;color:var(--muted);margin:0 0 11px}
.cn-qr{width:min(100%,240px);aspect-ratio:1;margin:0 auto;padding:6px;background:#fff;border-radius:16px;border:1px solid var(--line2)}.cn-qr svg{display:block;width:100%;height:100%}
.cn-fail{padding:14px;border:1.5px dashed var(--line2);border-radius:14px;color:var(--muted);font-size:12.5px;text-align:center}
.cn-apps{display:grid;gap:8px}
a.cn-app{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);text-decoration:none;font-size:14px;font-weight:700;transition:border-color .15s}
a.cn-app:hover{border-color:var(--sec)}a.cn-app small{color:var(--muted);font-size:11px;font-weight:400}
.cn-copy{width:100%}

/* live connection panel (driven by the native app, or by the preview simulator) */
.vpn-native-hint{padding:12px 14px;border:1.5px dashed var(--line2);border-radius:14px;color:var(--muted);font-size:12.5px;line-height:2;margin:0 0 14px}
.vpn-native-hint button,.vc-sim button{border:0;background:transparent;color:var(--sec);font-weight:700;font-size:12.5px;cursor:pointer;padding:0 4px;text-decoration:underline}
.vpn-conn{padding:16px;background:var(--panel);border:1px solid var(--line2);border-radius:20px;margin:0 0 16px}
.vc-sim{display:flex;justify-content:space-between;align-items:center;margin:-4px -4px 12px;padding:6px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:11.5px}
.vc-top{display:flex;align-items:center;gap:12px}.vc-info{flex:1;min-width:0}
.vc-dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--muted)}.vc-dot.connected{background:var(--ok);box-shadow:0 0 0 5px var(--ok-bg)}.vc-dot.connecting{background:var(--warn);animation:nox-pulse 1s ease-in-out infinite}.vc-dot.error{background:var(--danger)}
.vc-state{font-size:17px;font-weight:800}.vc-server{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere;margin-top:1px}
.vc-btn{flex:none;min-height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--danger-bd);background:var(--danger-bg);color:var(--danger);font-size:13px;font-weight:700;cursor:pointer}
.vc-spark{display:block;width:100%;height:44px;margin:14px 0 6px}.vc-spark polyline{stroke:var(--sec);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.vc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.vc-grid>div{padding:11px 13px;background:var(--panel2);border-radius:13px}
.vc-grid small{display:block;color:var(--muted);font-size:11.5px}.vc-grid b{display:block;margin-top:2px;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.server-card.live{border-color:var(--sec);box-shadow:inset 0 0 0 1px var(--sec)}
.server-card.live .server-name::after{content:var(--lbl-live," · متصل");color:var(--ok);font-size:12px;font-weight:600}.server-card.connecting .server-name::after{content:var(--lbl-connecting," · در حال اتصال");color:var(--warn);font-size:12px;font-weight:600}
.server-actions button.primary.stop{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-bd)}
@keyframes nox-pulse{50%{opacity:.35}}
@keyframes nox-fade{from{opacity:0}}
@keyframes nox-pop{from{opacity:0;transform:translateY(12px) scale(.97)}}
@keyframes nox-rise{from{opacity:0;transform:translate(-50%,8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:380px){h1,.project-hero h1,.vpn-hero h1,.gmail-hero h1,.notes-hero h1,.settings-hero h1{font-size:25px}nav button i{width:44px}.settings-row{flex-wrap:wrap}}


/* ===== v2 additions: logo, autosave, vpn form, settings, ltr ===== */
.logo{width:32px;height:32px;flex:none;display:block}
.logo-lg{width:64px;height:64px;flex:none;display:block}
.about-card{display:flex;align-items:center;gap:16px}.about-card h3{margin:0 0 2px;letter-spacing:.18em;font-size:18px}.about-card p{margin:0}
.settings-row+.settings-row{margin-top:12px}
.settings-card .settings-status{margin-top:10px}
.switch{appearance:none;-webkit-appearance:none;flex:none;width:48px;height:28px;padding:0;margin:0;border-radius:999px;background:var(--panel2);border:1px solid var(--line2);position:relative;cursor:pointer;transition:background .2s,border-color .2s}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch:checked{background:color-mix(in srgb,var(--c-core) 35%,transparent);border-color:var(--c-core)}
.switch:checked::after{background:var(--c-core);transform:translateX(20px)}
[dir=rtl] .switch:checked::after{transform:translateX(-20px)}
.draft-status{font-size:11.5px;color:var(--ok);margin:8px 4px 0;min-height:18px;opacity:0;transition:opacity .25s}.draft-status.on{opacity:1}
.vpn-form{display:grid;gap:10px;padding:14px;background:var(--panel);border:1px solid var(--border);border-radius:18px;margin:0 0 6px}
.vpn-form textarea{min-height:92px;resize:vertical;font:12.5px/1.8 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.vpn-form-actions{display:flex;gap:8px;flex-wrap:wrap}.vpn-form-actions .add-project{flex:1;min-width:140px}
.btn-ghost{flex:none;min-height:46px;border:1px solid var(--line2);border-radius:12px;padding:0 16px;background:var(--panel2);color:var(--text);font-size:13.5px;font-weight:600;cursor:pointer;transition:border-color .15s}.btn-ghost:hover{border-color:var(--muted)}
.server-actions button.danger{flex:none;padding:0 12px;color:var(--danger);border-color:var(--danger-bd);background:var(--danger-bg)}
.vpn-note{margin-top:14px}
.toast{white-space:normal;text-align:center;width:max-content}
[dir=ltr] .gmail-address,[dir=ltr] .server-host,[dir=ltr] .cn-host,[dir=ltr] .vc-grid b{text-align:left}
[dir=ltr] .note-card.pinned{box-shadow:inset 3px 0 0 var(--sec)}
[dir=ltr] header{letter-spacing:.2em}

 let first=await vpnProbe(v,4500);if(first.timeout){status.className='server-status bad';status.textContent=t('no_reply');result.textContent=t('no_reply_long');btn.disabled=false;return}
 let ms=[first.ms];for(let n=0;n<2;n++){result.textContent=t('sample_n',num(n+2));let r=await vpnProbe(v,4500);if(!r.timeout)ms.push(r.ms)}
 let best=Math.min(...ms),avg=Math.round(ms.reduce((a,b)=>a+b,0)/ms.length);status.className='server-status '+(best<400?'ok':'warn');let L=x=>'\u2066'+num(x)+' ms\u2069';status.textContent=L(best);result.textContent=t('replied',L(best),num(ms.length),L(avg));btn.disabled=false}

root.innerHTML=`<div class="overlay" id="overlay"><section class="dialog connect-dialog" role="dialog" aria-modal="true" aria-label="${t('cn_aria')}"><h2>${escapeHtml(vn(v))}</h2><div class="cn-host">${escapeHtml(v.host)} : ${v.port}</div>
<div class="cn-sec"><h3>${t('cn_scan_h')}</h3><p>${t('cn_scan_p')}</p>${qr?`<div class="cn-qr">${qr}</div>`:`<div class="cn-fail">${t('cn_toolong')}</div>`}</div>
<div class="cn-sec"><h3>${t('cn_open_h')}</h3><p>${t('cn_open_p')}</p><div class="cn-apps"><a class="cn-app" href="hiddify://import/${u}">Hiddify <small>${t('cn_hiddify')}</small></a><a class="cn-app" href="streisand://import/${u}">Streisand <small>iOS</small></a><a class="cn-app" href="shadowrocket://add/${u}">Shadowrocket <small>iOS</small></a></div></div>
<div class="cn-sec"><h3>${t('cn_manual_h')}</h3><p>${t('cn_manual_p')}</p><button class="add-project cn-copy" id="cn-copy" type="button">${t('copy_link')}</button></div>
<div class="settings-status">${t('cn_status')}</div>
<div class="actions"><button class="cancel" id="cn-close" type="button">${t('close')}</button></div></section></div>`;
let close=()=>{root.innerHTML='';document.removeEventListener('keydown',esc)},esc=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',esc);
$('#cn-close').onclick=close;$('#overlay').onclick=e=>{if(e.target.id==='overlay')close()};$('#cn-copy').onclick=()=>copyText(v.uri);$('#cn-close').focus({preventScroll:true})}
function addVpn(text,custom){let lines=String(text).split(/\r?\n/).map(s=>s.trim()).filter(Boolean),r={added:0,dup:0,bad:0};
 lines.forEach(l=>{let v=parseVpn(l,lines.length===1?custom:'');if(!v){r.bad++;return}if(vpnServers.some(x=>x.uri===v.uri)){r.dup++;return}vpnServers.push(v);r.added++});return r}

/* ---------- backup ---------- */
function exportData(){let payload={app:'NOX',version:2,exportedAt:new Date().toISOString(),data,projects,gmails,notes,vpn:vpnServers};if(window.NoxVPN&&window.NoxVPN.saveFile){window.NoxVPN.saveFile('NOX-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(payload,null,2));toast(t('backup_ready'));return}let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='NOX-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(t('backup_ready'))}
function importData(file){if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);if(!isObj(x)||!isObj(x.data)||!Array.isArray(x.projects)||!Array.isArray(x.gmails)||!Array.isArray(x.notes))throw new Error('bad');if(!confirm(t('restore_confirm')))return;
 data=x.data;projects=x.projects;gmails=x.gmails;notes=x.notes;if(Array.isArray(x.vpn))vpnServers=cleanVpn(x.vpn);
 localStorage.setItem(STORE,JSON.stringify(data));localStorage.setItem(K_PROJ,JSON.stringify(projects));localStorage.setItem(K_GMAIL,JSON.stringify(gmails));localStorage.setItem(K_NOTES,JSON.stringify(notes));if(Array.isArray(x.vpn))localStorage.setItem(K_VPN,JSON.stringify(vpnServers));render();toast(t('restore_ok'))}catch(e){toast(t('restore_bad'))}};reader.readAsText(file)}

/* ---------- theme + language ---------- */
let themePref='dark';
function applyTheme(pref){if(!['dark','light','system'].includes(pref))pref='dark';themePref=pref;let light=pref==='light'||(pref==='system'&&!!window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches);document.body.classList.toggle('light-theme',light);try{localStorage.setItem(K_THEME,pref)}catch(e){}let m=document.querySelector('meta[name=theme-color]');if(m)m.content=light?'#f3f5fa':'#0c0e16'}
try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(themePref==='system')applyTheme('system')})}catch(e){}
function applyLang(){let d=document.documentElement;d.lang=lang;d.dir=lang==='fa'?'rtl':'ltr';document.title=t('title');
 document.querySelectorAll('nav button').forEach(b=>{b.querySelector('span').textContent=t('nav_'+b.dataset.tab)});$('nav').setAttribute('aria-label',t('nav_aria'));
 d.style.setProperty('--lbl-live',JSON.stringify(' · '+t('badge_live')));d.style.setProperty('--lbl-connecting',JSON.stringify(' · '+t('badge_connecting')))}

/* ---------- render ---------- */
function pageHtml(){return tab==='settings'?settingsPage():tab==='notes'?notesPage():tab==='gmail'?gmailPage():tab==='noxcod'?noxcodPage():vpnPage()}
function afterRender(){restoreDrafts();if(tab==='vpn')vpnApply();if(tab==='settings')settingsInit()}
function render(){$('#app').innerHTML=pageHtml();afterRender();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}

/* ---------- events ---------- */
$('nav').onclick=e=>{let b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;prefs.lastTab=tab;savePrefs();render()}};
const app=$('#app');
app.oninput=e=>{let T=e.target;if(T.id==='note-search'){let pos=T.selectionStart;noteSearch=T.value;app.innerHTML=notesPage();afterRender();let n=$('#note-search');n.focus();n.setSelectionRange(pos,pos);return}if(DRAFT_IDS.includes(T.id))draftSet(T.id,T.value)};
app.onchange=e=>{let T=e.target,v=T.value;
 if(DRAFT_IDS.includes(T.id))draftSet(T.id,v);
 if(T.id==='lang-select'){lang=v==='en'?'en':'fa';try{localStorage.setItem(K_LANG,lang)}catch(er){}applyLang();render();toast(t('lang_changed'));return}
 if(T.id==='theme-select'){applyTheme(v);toast(t('theme_changed'));return}
 if(T.id==='start-select'){prefs.start=v;savePrefs();toast(t('pref_saved'));return}
 if(T.id==='autosave-toggle'){prefs.autosave=T.checked;savePrefs();if(!T.checked){clearTimeout(draftTimer);drafts={};draftDirty=false;persistDrafts()}let s=$('#autosave-status');if(s)s.textContent=autosaveText();toast(t(T.checked?'auto_on_toast':'auto_off_toast'));return}
 if(T.id==='import-file'){importData(T.files&&T.files[0]);T.value=''}};
app.onclick=e=>{const T=e.target,c=s=>T.closest(s);let el;
 if(el=c('[data-pin-note]')){let i=Number(el.dataset.pinNote);if(notes[i]){notes[i].pinned=!notes[i].pinned;notes[i].updated=Date.now();saveNotes();render()}return}
 if(el=c('[data-delete-note]')){let i=Number(el.dataset.deleteNote);if(notes[i]&&confirm(t('note_del_confirm'))){notes.splice(i,1);saveNotes();render();toast(t('note_deleted'))}return}
 if(el=c('[data-edit-note]')){let i=Number(el.dataset.editNote),n=notes[i];if(n){$('#note-title').value=n.title;$('#note-body').value=n.body||'';$('#note-category').value=n.category||'متفرقه';setEditMode($('#note-form'),i);
   draftSet('note-title',n.title);draftSet('note-body',n.body||'');draftSet('note-category',n.category||'متفرقه');if(autosaveOn()&&n.created)drafts.__edit=n.created;
   $('#note-title').focus();window.scrollTo({top:0,behavior:'smooth'})}return}
 if(T.id==='export-data'){exportData();return}
 if(T.id==='import-trigger'){$('#import-file').click();return}
 if(T.id==='clear-notes'){if(confirm(t('clear_confirm'))){notes=[];saveNotes();render();toast(t('notes_cleared'))}return}
 if(T.id==='reset-all'){if(confirm(t('reset_confirm'))){[STORE,K_PROJ,K_GMAIL,K_NOTES,K_VPN,K_DRAFT,K_PREFS,K_THEME].forEach(k=>localStorage.removeItem(k));data={};projects=[];gmails=[];notes=[];drafts={};draftDirty=false;prefs={autosave:true,start:'last',lastTab:tab};vpnServers=JSON.parse(JSON.stringify(VPN_DEFAULTS));applyTheme('dark');render();toast(t('reset_done'))}return}
 if(el=c('[data-copy-vpn]')){let v=vpnServers[Number(el.dataset.copyVpn)];if(v)copyText(v.uri);return}
 if(el=c('[data-connect-vpn]')){vpnToggle(Number(el.dataset.connectVpn));return}
 if(el=c('[data-delete-vpn]')){let i=Number(el.dataset.deleteVpn),v=vpnServers[i];if(!v)return;if(!confirm(t('vpn_del_confirm',vn(v))))return;let b=vpnBridge();if(b&&vpnLive.uri===v.uri&&vpnLive.state!=='disconnected'){try{b.disconnect()}catch(er){}}vpnServers.splice(i,1);saveVpn();render();toast(t('vpn_deleted'));return}
 if(c('#vc-btn')){let b=vpnBridge();if(b)b.disconnect();return}
 if(c('#vpn-sim-on')){vpnSimOn=true;render();return}
 if(c('#vpn-sim-off')){vpnSimStop();vpnSimOn=false;vpnLive={state:'disconnected',name:'',uri:'',down:0,up:0,sRx:0,sTx:0,tRx:0,tTx:0};vpnHist=[];render();return}
 if(c('#vpn-paste')){if(navigator.clipboard&&navigator.clipboard.readText)navigator.clipboard.readText().then(x=>{let ta=$('#vpn-link');if(ta){ta.value=x;draftSet('vpn-link',x);ta.focus()}}).catch(()=>toast(t('vpn_paste_fail')));else toast(t('vpn_paste_fail'));return}
 if(c('#test-all-vpn')){testAllVpn();return}
 if(el=c('[data-test-vpn]')){testVpn(Number(el.dataset.testVpn));return}
 if(el=c('[data-delete-gmail]')){let i=Number(el.dataset.deleteGmail);if(Number.isInteger(i)&&i>=0&&i<gmails.length&&confirm(t('gmail_del_confirm'))){gmails.splice(i,1);put(K_GMAIL,gmails);render();toast(t('gmail_removed'))}return}
 if(el=c('[data-delete-project]')){let i=Number(el.dataset.deleteProject);if(Number.isInteger(i)&&i>=0&&i<projects.length){let name=projects[i];if(confirm(t('proj_del_confirm',name))){projects.splice(i,1);put(K_PROJ,projects);render();toast(t('proj_deleted'))}}}};
app.onsubmit=e=>{let f=e.target;
 if(f.id==='note-form'){e.preventDefault();let title=$('#note-title').value.trim(),body=$('#note-body').value.trim(),category=$('#note-category').value,idx=f.dataset.editIndex;if(!title){toast(t('note_need_title'));return}
  if(idx!==undefined&&notes[Number(idx)]){let old=notes[Number(idx)];notes[Number(idx)]={...old,title,body,category,updated:Date.now()};toast(t('note_updated'))}else{notes.unshift({title,body,category,pinned:false,created:Date.now()});toast(t('note_saved'))}
  saveNotes();noteSearch='';clearDrafts(['note-title','note-category','note-body']);render();return}
 if(f.id==='project-form'){e.preventDefault();let input=$('#project-name'),name=input.value.trim();if(!name){input.focus();return}if(projects.some(x=>x.toLocaleLowerCase()===name.toLocaleLowerCase())){toast(t('proj_dup'));input.focus();return}projects.push(name);put(K_PROJ,projects);clearDrafts(['project-name']);render();toast(t('proj_added'));return}
 if(f.id==='gmail-form'){e.preventDefault();let label=$('#gmail-label'),address=$('#gmail-address'),note=$('#gmail-note'),entry={label:label.value.trim(),address:address.value.trim(),note:note.value.trim()};if(!entry.label||!entry.address){toast(t('gmail_need'));return}if(gmails.some(g=>g.address.toLowerCase()===entry.address.toLowerCase())){toast(t('gmail_dup'));address.focus();return}gmails.push(entry);put(K_GMAIL,gmails);clearDrafts(['gmail-label','gmail-address','gmail-note']);render();toast(t('gmail_added'));return}
 if(f.id==='vpn-form'){e.preventDefault();let r=addVpn($('#vpn-link').value,$('#vpn-name').value);if(!r.added){toast(r.dup&&!r.bad?t('vpn_all_dup'):t('vpn_none'));return}saveVpn();clearDrafts(['vpn-link','vpn-name']);render();toast([t('vpn_added',num(r.added)),r.dup?t('vpn_dup_n',num(r.dup)):'',r.bad?t('vpn_bad_n',num(r.bad)):''].filter(Boolean).join(' · '))}};

/* ---------- start ---------- */
try{applyTheme(localStorage.getItem(K_THEME)||'dark')}catch(e){applyTheme('dark')}
applyLang();render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
})();
</script></body></html>
