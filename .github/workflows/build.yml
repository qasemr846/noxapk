name: Build NOX APK

on:
  workflow_dispatch: {}
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Xray-core (Android arm64)
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a /tmp/xray
          curl -fsSL -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-android-arm64-v8a.zip
          unzip -o /tmp/xray.zip -d /tmp/xray
          BIN=$(find /tmp/xray -type f -name xray | head -1)
          test -n "$BIN"
          cp "$BIN" app/src/main/jniLibs/arm64-v8a/libxray.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libxray.so
          file app/src/main/jniLibs/arm64-v8a/libxray.so

      - name: Build hev-socks5-tunnel (native tun -> SOCKS bridge)
        run: |
          set -e
          mkdir -p /tmp/hev/jni
          git clone --recursive --depth 1 https://github.com/heiher/hev-socks5-tunnel /tmp/hev/jni/hev-socks5-tunnel
          echo 'include $(call all-subdir-makefiles)' > /tmp/hev/jni/Android.mk
          cd /tmp/hev
          "$ANDROID_NDK_LATEST_HOME/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk \
            APP_ABI=arm64-v8a APP_PLATFORM=android-24 NDK_LIBS_OUT="$PWD/libs"
          cp libs/arm64-v8a/libhev-socks5-tunnel.so "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/"
          file "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so"
          # the JNI class name the library registers must match hev/htproxy/TProxyService
          strings "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so" | grep -i "TProxyService" || true

      - name: Verify JNI signatures match TProxyService.java
        run: |
          SO="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so"
          SIGS=$(strings -a "$SO")
          echo "Signatures found in the library:"
          grep -E '^\(.*\)(V|Z|I|J|\[J)$' <<< "$SIGS" | sort -u || true
          grep -qxF '(Ljava/lang/String;I)Z' <<< "$SIGS" || { echo "::error::TProxyStartService signature changed - update TProxyService.java"; exit 1; }
          grep -qxF '()V' <<< "$SIGS" || { echo "::error::TProxyStopService signature changed - update TProxyService.java"; exit 1; }
          grep -qxF '()[J' <<< "$SIGS" || { echo "::error::TProxyGetStats signature changed - update TProxyService.java"; exit 1; }

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: NOX-apk
          path: app/build/outputs/apk/debug/app-debug.apk
